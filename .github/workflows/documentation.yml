name: Documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  # The site footer shows the version, which comes from the tag.
                  fetch-depth: 0

            - name: Install doxygen and ninja
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends doxygen ninja-build

            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.14.3'
                  enable-cache: 'true'

            - name: Install the documentation tooling
              run: uv pip install --system -r tools/docs/requirements.txt

            # Generates docs/api/generated/ from the header comments. CI is
            # detected by tools/docs/CMakeLists.txt, which turns Doxygen warnings into
            # errors: an undocumented public symbol fails the build.
            - name: Generate the API reference
              run: |
                  cmake --preset ci -DCPP_LIBRARY_TEMPLATE_BUILD_DOCS=ON
                  cmake --build build/ci --target docs

            - name: Build the site
              run: zensical build

            - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
