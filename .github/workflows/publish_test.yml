name: Publish to the test Conan remote

# The counterpart of publishing to TestPyPI: every push to main produces a
# development package and uploads it to a separate remote. It proves the publish
# path works without waiting for a release, and gives you something to install
# when you want to try main from a real remote.
#
# PUBLISHING IS OFF IN THIS TEMPLATE, AND THIS FILE IS STILL COMPLETE.
#
# The switch is the same repository variable as publish.yml, `ENABLE_PUBLISHING`.
# While it is unset this job is skipped before it starts, so a fresh template does
# not spend a runner on every push to main.
#
# To turn it on:
#
#   1. Create a `conan-test` environment with CONAN_TEST_REMOTE_URL,
#      CONAN_LOGIN_USERNAME and CONAN_PASSWORD.
#   2. Set the ENABLE_PUBLISHING repository variable to `true`.
#
# One variable governs both this workflow and publish.yml on purpose: two switches
# would be two things to remember, and the interesting failure is publishing being
# half-configured.

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag_name:
                description:
                    'Optional tag to publish instead of the current main'
                required: false
                type: string

permissions:
    contents: read

jobs:
    publish:
        # The switch. See the comment at the top of the file.
        if: ${{ vars.ENABLE_PUBLISHING == 'true' }}
        runs-on: ubuntu-latest
        environment:
            name: conan-test
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: ${{ inputs.tag_name || github.sha }}
                  fetch-depth: 0

            # Fail before spending several minutes building a package that cannot
            # be uploaded.
            - name: Check the credentials are present
              env:
                  CONAN_REMOTE_URL: ${{ secrets.CONAN_TEST_REMOTE_URL }}
                  CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
                  CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
              run: |
                  missing=""
                  if [ -z "$CONAN_REMOTE_URL" ]; then missing="$missing CONAN_TEST_REMOTE_URL"; fi
                  if [ -z "$CONAN_LOGIN_USERNAME" ]; then missing="$missing CONAN_LOGIN_USERNAME"; fi
                  if [ -z "$CONAN_PASSWORD" ]; then missing="$missing CONAN_PASSWORD"; fi
                  if [ -n "$missing" ]; then
                    echo "::error title=Publishing misconfigured::ENABLE_PUBLISHING is 'true' but these secrets are missing on the 'conan-test' environment:$missing"
                    exit 1
                  fi

            - name: Install conan
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ninja-build
                  pipx install conan
                  conan profile detect --force

            # An untagged build gets a version derived from `git describe`, which
            # already encodes the commit distance and hash, e.g.
            # 0.3.1-4-gdeadbee. That is a valid Conan version and sorts after
            # 0.3.1, so it cannot be mistaken for a release.
            - name: Resolve the version
              run: |
                  if [ -n "${{ inputs.tag_name }}" ]; then
                    VERSION="${{ inputs.tag_name }}"
                    VERSION="${VERSION#v}"
                  else
                    VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || echo "")
                    if [ -z "$VERSION" ]; then
                      # No tag exists yet: fall back to 0.0.0 plus the short sha.
                      VERSION="0.0.0-$(git rev-parse --short HEAD)"
                    fi
                  fi
                  echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
                  echo "PACKAGE_REFERENCE=cpp_library_template/${VERSION}" >> "$GITHUB_ENV"

            - name: Build and test the package
              run:
                  conan create . --version "$PACKAGE_VERSION" --build=missing -s
                  compiler.cppstd=20

            - name: Add the remote
              run: conan remote add publish-test "$CONAN_REMOTE_URL" --force
              env:
                  CONAN_REMOTE_URL: ${{ secrets.CONAN_TEST_REMOTE_URL }}

            # No continue-on-error: see publish.yml.
            - name: Upload
              run:
                  conan upload "$PACKAGE_REFERENCE" --remote publish-test
                  --confirm
              env:
                  CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
                  CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

            - name: Summary
              run: |
                  {
                    echo "### Published (development)"
                    echo
                    echo "\`$PACKAGE_REFERENCE\` to the test remote"
                  } >> "$GITHUB_STEP_SUMMARY"
