name: Scheduled Release

# The orchestrator. Once a week it asks: has anything landed since the last tag?
# If so it runs the full checks, computes the next version from the conventional
# commit messages, tags it, publishes the release and the package.
#
# Nothing here decides a version number by hand: git-cliff reads the commits and
# derives the bump.

on:
    schedule:
        - cron: '0 0 * * 2'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check_new_commits:
        runs-on: ubuntu-latest
        outputs:
            has-changes: ${{ steps.detect.outputs.has-changes }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Detect commits since the latest tag
              id: detect
              uses: isaac-cf-wong/detect-git-changes-action@c49bec37fa3496222c70649af3a09e2c2612310e # v0.0.15
              with:
                  use-latest-tag: true

    ci:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        uses: ./.github/workflows/ci.yml

    codeql:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        permissions:
            security-events: write
            actions: read
            contents: read
        uses: ./.github/workflows/codeql.yml

    create_tag:
        needs: [check_new_commits, ci, codeql]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            new_tag: ${{ steps.tag_version.outputs.new_tag }}
            previous_tag: ${{ steps.tag_version.outputs.previous_tag }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Install git-cliff
              run: pipx install git-cliff

            - name: Bump the version and push the tag
              id: tag_version
              run: |
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "none")
                  if [ "$PREVIOUS_TAG" = "none" ]; then
                    NEW_TAG="v0.1.0"
                  else
                    NEW_TAG=$(git-cliff --bumped-version --config cliff.toml 2>/dev/null)
                  fi

                  if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
                    echo "Tag $NEW_TAG already exists, nothing to release."
                    exit 1
                  fi

                  echo "Creating annotated tag $NEW_TAG"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
                  git push origin "$NEW_TAG"

                  echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

            - name: Summary
              run: |
                  {
                    echo "### Tagged"
                    echo
                    echo "| | |"
                    echo "| --- | --- |"
                    echo "| new tag | \`${{ steps.tag_version.outputs.new_tag }}\` |"
                    echo "| previous tag | \`${{ steps.tag_version.outputs.previous_tag }}\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

    release:
        needs: create_tag
        permissions:
            contents: write
        uses: ./.github/workflows/release.yml
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}

    # Publishing is off unless the ENABLE_PUBLISHING repository variable is set to
    # `true`, so in a fresh template this job reports as skipped and the release
    # still completes. The GitHub Release is created either way; only the upload to
    # a Conan remote is gated. See .github/workflows/publish.yml.
    publish:
        needs: [create_tag, release]
        permissions:
            contents: read
        uses: ./.github/workflows/publish.yml
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}
        secrets: inherit
