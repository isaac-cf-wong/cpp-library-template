name: Lint PR

# Pull request titles become the commit messages on main (squash merge), and
# git-cliff derives the version bump and the release notes from them. A title
# that is not a conventional commit therefore breaks the release automation,
# which is why this check is required rather than advisory.

on:
    pull_request_target:
        types: [opened, reopened, edited, synchronize]

permissions:
    pull-requests: read

jobs:
    main:
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
