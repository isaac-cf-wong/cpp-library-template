# Run these locally with `prek install` (or `pre-commit install`). Renovate keeps
# the `rev` pins up to date and automerges those PRs.
#
# clang-tidy is deliberately NOT here: it needs compile_commands.json and a full
# build, which makes it far too slow for a commit hook. It runs in CI instead,
# see .github/workflows/static_analysis.yml.

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-yaml
          - id: check-toml
          - id: check-json
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace

    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.0
      hooks:
          - id: clang-format
            types_or: [c, c++]
            args: [--style=file]

    # Note the repository: the hook lives in gersemi-pre-commit, not in gersemi
    # itself, which has no .pre-commit-hooks.yaml.
    - repo: https://github.com/BlankSpruce/gersemi-pre-commit
      rev: 0.28.1
      hooks:
          - id: gersemi

    - repo: https://github.com/ComPWA/taplo-pre-commit
      rev: v0.9.3
      hooks:
          - id: taplo-format

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.6
      hooks:
          # conanfile.py, test_package/conanfile.py and the docs generator are
          # the only Python in the repository, but they should still be clean.
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/crate-ci/typos
      rev: v1
      hooks:
          - id: typos
            args: []

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2
            args: [--config, .markdownlint.yaml]

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint

    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1-1
      hooks:
          - id: shellcheck

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.0
      hooks:
          - id: gitleaks

    - repo: local
      hooks:
          # Every public header must be self-contained: including it on its own
          # must compile. This is the cheap version of include-what-you-use.
          - id: headers-are-self-contained
            name: public headers compile standalone
            language: script
            entry: scripts/check_headers.sh
            files: ^include/.*\.hpp$
            pass_filenames: true
            require_serial: true
